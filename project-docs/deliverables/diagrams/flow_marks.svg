   </g>
   <g id="text_10">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #ffffff" transform="translate(600.255328 101.64904)">students can now see</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #ffffff" transform="translate(615.018961 108.682751)">their marks</text>
   </g>
