   </g>
   <g id="text_6">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(247.914008 101.64904)">teacher submits the</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(248.251703 108.682751)">assessment's marks</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #3d2e31" x="453.6" y="81.108188" transform="rotate(-0 453.6 81.108188)">Approved</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(412.193477 97.987839)">reviewer (education.manage)</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(421.968359 105.183161)">approves — never the</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(439.851484 112.343952)">submitter</text>
