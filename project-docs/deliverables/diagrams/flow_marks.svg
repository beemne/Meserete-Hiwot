   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: start; fill: #8a7a7d" x="15.57" y="33.785006" transform="rotate(-0 15.57 33.785006)">Edu.php · EduMarks.php — only ACTIVE course teachers enter marks; no self-approval; every change kept in edu_score_history</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #ffffff" x="98.712" y="81.241084" transform="rotate(-0 98.712 81.241084)">Draft</text>
   </g>
   <g id="text_4">
