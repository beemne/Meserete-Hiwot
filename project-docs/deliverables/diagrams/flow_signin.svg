   </g>
   <g id="text_16">
    <text style="font-size: 7.6px; font-family: 'Segoe UI'; text-anchor: start; fill: #3d2e31" x="18.36" y="264.996" transform="rotate(-0 18.36 264.996)">• Forgotten PIN: a 6-digit code (15 minutes, 5 attempts) is sent by Telegram when linked, otherwise by e-mail; the response never reveals whether the account exists.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.6px; font-family: 'Segoe UI'; text-anchor: start; fill: #3d2e31" x="18.36" y="279.4104" transform="rotate(-0 18.36 279.4104)">• Accounts may be pending approval or disabled; members can be registered without sign-in rights (can_login = false).</text>
