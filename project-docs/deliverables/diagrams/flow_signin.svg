   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Segoe UI'; text-anchor: start; fill: #6e1423" x="15.57" y="23.017112" transform="rotate(-0 15.57 23.017112)">Sign-in, device binding and session lifetime</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: start; fill: #8a7a7d" x="15.57" y="33.762428" transform="rotate(-0 15.57 33.762428)">AuthService.php · Middleware.php · Tokens.php</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #ffffff" x="98.712" y="81.191279" transform="rotate(-0 98.712 81.191279)">Credentials</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #ffffff" transform="translate(70.105906 97.953308)">phone/e-mail + PIN</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #ffffff" transform="translate(68.318914 105.183161)">(4–6 digits); 5 failures</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #ffffff" transform="translate(78.090242 112.378484)">→ 15-min lock</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #3d2e31" x="276.156" y="81.191279" transform="rotate(-0 276.156 81.191279)">Device check</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(244.644203 98.068645)">members: one trusted</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(248.431977 105.102356)">device per account;</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(242.854672 112.263147)">admins: several devices</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #3d2e31" x="453.6" y="81.191279" transform="rotate(-0 453.6 81.191279)">Tokens</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(426.278164 97.953308)">short access JWT +</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(422.333984 105.056081)">rotating refresh token</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(415.520156 112.251403)">(app sessions don't expire)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #3d2e31" x="631.044" y="81.108188" transform="rotate(-0 631.044 81.108188)">Each request</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(596.647828 98.132185)">token version, device id,</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(597.439508 105.165896)">revocation and account</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(604.5565 112.199607)">status are checked</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #ffffff" x="808.488" y="81.191279" transform="rotate(-0 808.488 81.191279)">End</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #ffffff" transform="translate(768.852219 97.907033)">logout, admin force-logout,</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #ffffff" transform="translate(776.214992 105.102356)">device reset, password</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #ffffff" transform="translate(775.249133 112.332209)">change, theft detection</text>
   </g>
