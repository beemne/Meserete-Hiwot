   </g>
   <g id="text_13">
    <text style="font-size: 7.6px; font-family: 'Segoe UI'; text-anchor: start; fill: #3d2e31" x="18.36" y="264.996" transform="rotate(-0 18.36 264.996)">• Attendance captures older than 3 days are refused (CAPTURE_TOO_OLD); refused attendance goes to the HR review queue with its signature.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.6px; font-family: 'Segoe UI'; text-anchor: start; fill: #3d2e31" x="18.36" y="279.4104" transform="rotate(-0 18.36 279.4104)">• GET responses are cached per user for read-only offline display. Admin writes outside the listed operations need a connection.</text>
