   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: start; fill: #8a7a7d" x="15.57" y="33.785006" transform="rotate(-0 15.57 33.785006)">sync_service.dart · Sync.php · OfflinePack.php — the server always has the last word</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #ffffff" x="98.712" y="81.157993" transform="rotate(-0 98.712 81.157993)">Offline pack</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #ffffff" transform="translate(57.452234 98.016848)">downloaded online: member</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #ffffff" transform="translate(70.706141 105.119621)">card + QR; for staff:</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #ffffff" transform="translate(63.267703 112.153332)">directory, sessions, items</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #3d2e31" x="276.156" y="81.241084" transform="rotate(-0 276.156 81.241084)">Work offline</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(245.982797 98.08591)">favorites, downloads,</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(243.475219 105.119621)">reminders, attendance,</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(241.55518 112.153332)">borrowing, task updates</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #3d2e31" x="453.6" y="81.139067" transform="rotate(-0 453.6 81.139067)">Queue</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(423.980313 97.907033)">ops stored in SQLite;</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(426.591484 105.067824)">signature payloads</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(422.452813 112.263147)">encrypted (AES-GCM)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #3d2e31" x="631.044" y="81.03539" transform="rotate(-0 631.044 81.03539)">POST /sync</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(596.41068 98.034113)">batched with client_now</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(608.540289 105.136887)">(clock-skew fix);</text>
    <text style="font-size: 6.5px; font-family: 'Segoe UI'; fill: #8a7a7d" transform="translate(604.610836 112.170598)">idempotent op ids</text>
   </g>
