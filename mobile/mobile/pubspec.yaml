name: mezmur_zelideta
description: "Mezmur Zelideta — መዝሙር ዘልደታ. Mezmur lyrics, audio, programs and library for Meserete Hiwot Sunday School."
publish_to: 'none'

version: 1.5.3+25

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # Networking & storage
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.4
  crypto: ^3.0.3
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  uuid: ^4.6.0
  intl: ^0.20.2

  # Audio
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4

  # Notifications
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # UI helpers
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.2
  flutter_cache_manager: ^3.4.1
  local_auth: ^2.3.0
  signature: ^6.4.0
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  photo_manager: ^3.12.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  pdfrx: 2.4.8
  pointycastle: ^4.0.0
  youtube_player_iframe: 5.2.2
  video_player: 2.11.1
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/audio/

  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansEthiopic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansEthiopic-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansEthiopic-700.ttf
          weight: 700
    - family: NotoSerifEthiopic
      fonts:
        - asset: assets/fonts/NotoSerifEthiopic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifEthiopic-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSerifEthiopic-700.ttf
          weight: 700

# App icon generated from the church seal: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: false
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 18
