  <meta charset="UTF-8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="መሠረተ ሕይወት">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

<body>
  <div id="loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAF8F5;font-family:sans-serif;z-index:999999;transition:opacity 0.4s ease;">
    <div style="width:68px;height:68px;border-radius:50%;background:#B8860B;margin-bottom:16px;box-shadow:0 6px 18px rgba(184,134,11,0.25);display:flex;align-items:center;justify-content:center;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
    </div>
    <div style="font-size:22px;font-weight:bold;color:#6E1423;margin-bottom:6px;letter-spacing:0.5px;">መሠረተ ሕይወት</div>
    <div style="font-size:13px;color:#888;margin-bottom:24px;">Mezmur Zelideta</div>
    <div style="width:36px;height:36px;border:3px solid #EADBCE;border-top-color:#6E1423;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 400);
      }
    });
  </script>
